:root[data-theme="dark"]{--paper:#0b0f16;--grid:#161c27;--card:#151c28;--ink:#fff;--muted:#c5ccd9;--pen:#9db4ff;--pen-soft:#1f2a45;--line:#4a5770;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--kai);font-size:18px;line-height:1.75;-webkit-text-stroke:.4px currentColor}
.wrap{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 60px}
.school{font-size:15px;color:var(--muted);letter-spacing:.05em}
h1{font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1.25;margin:4px 0 6px}
h1 .bolt{color:#e0a800}
.lead{margin:0 0 22px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.subjects{grid-template-columns:1fr}}
.sub{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;transition:border-color .2s,transform .2s}
a.sub:hover{border-color:var(--pen);transform:translateY(-2px)}
a.sub:focus-visible{outline:3px solid var(--pen);outline-offset:3px}
.sub .ic{font-size:40px;line-height:1;-webkit-text-stroke:0}
.sub b{font-weight:400;font-size:34px;color:var(--pen)}
.sub span{font-size:16px}
.sub small{font-size:15px;color:var(--muted)}
.sub .go{margin-top:6px;align-self:flex-start;background:var(--pen);color:var(--card);border-radius:999px;padding:2px 16px;font-size:16px;-webkit-text-stroke:0}
.sub.wip{border-style:dashed;opacity:.75}
.sub.wip b{color:var(--muted)}
.tag{display:inline-block;font-size:13px;border:1.5px solid var(--muted);color:var(--muted);border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:middle;-webkit-text-stroke:0}
.gos{display:flex;flex-direction:column;gap:8px;margin-top:10px;width:100%}
.go2{display:block;text-decoration:none;color:#fff;border-radius:14px;padding:8px 14px;font-size:17px;-webkit-text-stroke:0;transition:transform .2s}
.go2:hover{transform:translateX(3px)}
.go2:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go2.stu{background:#137a4c} .go2.tea{background:var(--pen)}
footer{margin-top:36px;font-size:14px;color:var(--muted);text-align:center;-webkit-text-stroke:0}
